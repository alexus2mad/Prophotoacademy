server {
    listen 80;
    listen [::]:80;
    server_name staging.prophotoacademy.com.ua prophotoacademy.com.ua;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/prophotoacademy/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.prophotoacademy.com.ua;
    ssl_certificate /etc/letsencrypt/live/staging.prophotoacademy.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.prophotoacademy.com.ua/privkey.pem;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;


    # Previously issued production payment requests used this staging callback URL.
    # Signature verification remains in production; staging never receives merchant keys.
    location = /api/payments/wayforpay/callback {
        proxy_pass http://127.0.0.1:3140;
        proxy_http_version 1.1;
        proxy_set_header Host prophotoacademy.com.ua;
        proxy_set_header X-Forwarded-Host prophotoacademy.com.ua;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:3141;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Supabase refresh cookies plus Next.js preload headers exceed the 4k default.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
