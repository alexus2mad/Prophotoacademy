    <style>
      @font-face {
        font-family: KyivType;
        src: url('assets/fonts/kyivtype-regular.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: Manrope;
        src: url('assets/fonts/manrope-0.woff2') format('woff2');
        font-weight: 400;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #101211;
        color: #f2efe7;
        font-family: Manrope, sans-serif;
      }
      .role {
        position: absolute;
        left: 120px;
        top: 83px;
        font-size: 32px;
        line-height: 1.2;
        color: #d5e4b9;
      }
      .window {
        position: absolute;
        left: 120px;
        top: 170px;
        width: 1680px;
        height: 760px;
        overflow: hidden;
        border: 1px solid #454b40;
        border-radius: 20px;
        background: #101211;
      }
      .world {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .source {
        position: absolute;
        display: block;
        max-width: none;
      }
      .layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .full-photo {
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        display: block;
      }
      .display {
        font-family: KyivType, serif;
        font-weight: 400;
        letter-spacing: -3px;
        line-height: 1.04;
      }
      .cursor {
        position: absolute;
        width: 32px;
        height: 44px;
        z-index: 5;
        filter: drop-shadow(0 2px 3px #000000);
        pointer-events: none;
      }
      .ring {
        position: absolute;
        width: 72px;
        height: 72px;
        border: 3px solid #d5e4b9;
        border-radius: 50%;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #101211;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      .caption {
        position: absolute;
        left: 120px;
        right: 120px;
        bottom: 38px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          36px/1.35 Manrope,
          sans-serif;
        z-index: 80;
        color: #f2efe7;
      }
      .caption span {
        display: inline-block;
        background: #101211;
        padding: 12px 28px;
        border-radius: 12px;
      }
      .demo {
        position: absolute;
        right: 120px;
        top: 91px;
        color: #b9bdb4;
        font:
          22px/1.3 Manrope,
          sans-serif;
        z-index: 80;
      }
    </style>
